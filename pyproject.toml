[project]
name = "3d-printing-design-test"
version = "0.1.0"
description = "Engineering learning project: reproducible 3D-printing experiments and parametric part development."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
